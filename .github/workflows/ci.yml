name: CI

# Workflow réutilisable uniquement (pas de déclencheur push/pull_request en propre) :
# c'est cd.yml qui l'appelle via `uses:`, pour garder un seul pipeline cohérent malgré
# la séparation en plusieurs fichiers (GitHub Actions ne permet pas de `needs:` entre
# jobs de fichiers différents autrement).
on:
  workflow_call: {}

jobs:
  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
        working-directory: infrastructure
      - run: tflint --recursive
        working-directory: infrastructure

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # skip_check documente des compromis d'architecture deliberes, pas des trous de securite
      # ignores - chaque categorie a ete revue resource par resource avant d'etre exclue ici :
      # - CKV_AWS_356/107/108/109/110/111 : les policies IAM concernees (permissions boundary,
      #   terraform_deployer, roles Lambda, key policies KMS) utilisent Resource="*" parce que
      #   les actions couvertes (ec2:Describe*, xray:Put*, aoss:*, kms:* sur une key policy...)
      #   ne supportent pas le scoping par ARN, ou parce qu'il s'agit d'une permissions boundary
      #   (un plafond, jamais une attribution directe de droits).
      # - CKV_AWS_237 : create_before_destroy sur l'API Gateway REST elle-meme n'apporte rien
      #   ici (deja en place sur aws_api_gateway_deployment, ce qui est le point qui compte).
      # - CKV_AWS_120/CKV_AWS_225 : cache API Gateway desactive volontairement - reponses RAG
      #   dynamiques par utilisateur/question, un cache n'apporterait aucune valeur.
      # - CKV_AWS_116 : DLQ Lambda - ingestion en a deja un via
      #   aws_lambda_function_event_invoke_config (non reconnu par ce check, qui ne regarde que
      #   dead_letter_config) ; orchestrator/index_bootstrap sont invoques en synchrone, la
      #   notion de DLQ (async uniquement) ne s'applique pas.
      # - CKV_AWS_272 : code-signing Lambda - overhead disproportionne (profils AWS Signer) pour
      #   la taille de ce projet.
      # - CKV_AWS_115 : concurrence reservee - le quota de concurrence Lambda du compte est trop
      #   bas pour en reserver sans faire passer le pool non-reserve sous le minimum AWS de 10
      #   (voir le commentaire sur aws_lambda_function.ingestion).
      # - CKV_AWS_338 : retention des logs a 7 jours en dev/staging - choix de cout assume pour
      #   des environnements de test, pas de la donnee a valeur d'audit long terme.
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure
          skip_check: >-
            CKV_AWS_356,CKV_AWS_107,CKV_AWS_108,CKV_AWS_109,CKV_AWS_110,CKV_AWS_111,
            CKV_AWS_237,CKV_AWS_120,CKV_AWS_225,CKV_AWS_116,CKV_AWS_272,CKV_AWS_115,
            CKV_AWS_338

  tfsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure

  lint_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff black
      - run: ruff check src/
      - run: black --check src/

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r src/ingestion_lambda/requirements.txt
      - run: pip-audit -r src/query_orchestrator_lambda/requirements.txt
