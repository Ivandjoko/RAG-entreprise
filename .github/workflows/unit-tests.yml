name: Unit Tests

# Réutilisable uniquement, appelé depuis cd.yml (voir la note dans ci.yml).
on:
  workflow_call: {}

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # boto3/opensearch-py etc. sont importes au niveau module par le code teste
      # (guardrails.py, retrieval.py, metadata_store.py...) - sans ces deps, meme des tests
      # qui ne touchent jamais AWS echouent a l'import.
      - run: pip install pytest
      - run: pip install -r src/ingestion_lambda/requirements.txt
      - run: pip install -r src/query_orchestrator_lambda/requirements.txt
      - run: pytest tests/unit -v
