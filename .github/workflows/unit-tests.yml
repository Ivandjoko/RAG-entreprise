name: Unit Tests

# Réutilisable uniquement, appelé depuis cd.yml (voir la note dans ci.yml).
on:
  workflow_call: {}

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/unit
