name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "us-east-1"

permissions:
  id-token: write   # requis pour l'échange OIDC avec AWS (aws-actions/configure-aws-credentials)
  contents: read

jobs:
  # ---------- lint ----------

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
        working-directory: infrastructure
      - run: tflint --recursive
        working-directory: infrastructure

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure

  tfsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure

  lint_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff black
      - run: ruff check src/
      - run: black --check src/

  # ---------- test ----------

  unit_tests:
    runs-on: ubuntu-latest
    needs: [lint_python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/unit

  # ---------- plan ----------

  plan_dev:
    runs-on: ubuntu-latest
    needs: [tflint, checkov, tfsec, unit_tests]
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
        working-directory: infrastructure/environments/dev
      - run: terraform plan -out=tfplan
        working-directory: infrastructure/environments/dev
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/environments/dev/tfplan

  plan_staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [tflint, checkov, tfsec, unit_tests]
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
        working-directory: infrastructure/environments/staging
      - run: terraform plan -out=tfplan
        working-directory: infrastructure/environments/staging
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: infrastructure/environments/staging/tfplan

  plan_prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [tflint, checkov, tfsec, unit_tests]
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
        working-directory: infrastructure/environments/prod
      - run: terraform plan -out=tfplan
        working-directory: infrastructure/environments/prod
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: infrastructure/environments/prod/tfplan

  # ---------- security_scan ----------

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r src/ingestion_lambda/requirements.txt
      - run: pip-audit -r src/query_orchestrator_lambda/requirements.txt

  # ---------- deploy_dev ----------

  deploy_dev:
    runs-on: ubuntu-latest
    needs: [plan_dev, security_scan]
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/environments/dev
      - run: terraform init
        working-directory: infrastructure/environments/dev
      - run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/environments/dev

  # ---------- integration_test ----------

  integration_test:
    runs-on: ubuntu-latest
    needs: [deploy_dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/integration --base-url=$DEV_API_URL
        env:
          DEV_API_URL: ${{ vars.DEV_API_URL }}

  evaluate_rag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [deploy_dev]
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          cd src/evaluation
          python run_evaluation.py --output scores.json
          python check_thresholds.py --input scores.json --min-faithfulness 0.85 --min-recall 0.80
      - uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation
          path: |
            src/evaluation/scores.json
            src/evaluation/report.html
      - uses: mikepenz/action-junit-report@v4
        with:
          report_paths: src/evaluation/junit_report.xml

  # ---------- deploy_staging ----------
  # Se déclenche automatiquement sur merge vers main. Pour un déclenchement
  # manuel sur une autre branche, relancer le workflow via workflow_dispatch.

  deploy_staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [plan_staging, integration_test]
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: infrastructure/environments/staging
      - run: terraform init
        working-directory: infrastructure/environments/staging
      - run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/environments/staging

  # ---------- deploy_prod ----------
  # L'approbation manuelle obligatoire se configure dans GitHub :
  # Settings > Environments > prod > Required reviewers.

  deploy_prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [plan_prod, deploy_staging]
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: infrastructure/environments/prod
      - run: terraform init
        working-directory: infrastructure/environments/prod
      - run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/environments/prod
