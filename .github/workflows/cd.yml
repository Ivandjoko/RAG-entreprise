name: CD

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  # >= 1.9 : requis par backend.tf et versions.tf de tous les modules (voir required_version)
  TF_VERSION: "1.9.8"
  AWS_REGION: "eu-west-3"

permissions:
  id-token: write   # requis pour l'échange OIDC avec AWS (aws-actions/configure-aws-credentials)
  contents: read

jobs:
  # ---------- CI (lint terraform/python + scans sécurité), voir ci.yml ----------

  ci:
    uses: ./.github/workflows/ci.yml

  # ---------- tests unitaires, voir unit-tests.yml ----------

  unit_tests:
    needs: [ci]
    uses: ./.github/workflows/unit-tests.yml

  # ---------- build_orchestrator_layer ----------
  # Empaquette les dépendances tierces (opensearch-py, boto3, ...) de la Lambda
  # orchestrateur en layer : le zip du code source seul (orchestrator_lambda.tf)
  # ne les contient pas. Requis par tout job qui touche modules/retrieval.

  build_orchestrator_layer:
    runs-on: ubuntu-latest
    needs: [ci, unit_tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dependencies layer
        run: |
          mkdir -p infrastructure/modules/retrieval/build/python
          pip install -r src/query_orchestrator_lambda/requirements.txt \
            -t infrastructure/modules/retrieval/build/python \
            --platform manylinux2014_x86_64 --only-binary=:all:
          cd infrastructure/modules/retrieval/build
          zip -r orchestrator_layer.zip python
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrator-layer
          path: infrastructure/modules/retrieval/build/orchestrator_layer.zip

  # ---------- build_ingestion_layer ----------
  # Même principe que build_orchestrator_layer, pour les dépendances de la Lambda
  # d'ingestion (opensearch-py, pypdf, python-docx, beautifulsoup4). Requis par tout
  # job qui touche modules/ingestion.

  build_ingestion_layer:
    runs-on: ubuntu-latest
    needs: [ci, unit_tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dependencies layer
        run: |
          mkdir -p infrastructure/modules/ingestion/build/python
          pip install -r src/ingestion_lambda/requirements.txt \
            -t infrastructure/modules/ingestion/build/python \
            --platform manylinux2014_x86_64 --only-binary=:all:
          cd infrastructure/modules/ingestion/build
          zip -r ingestion_layer.zip python
      - uses: actions/upload-artifact@v4
        with:
          name: ingestion-layer
          path: infrastructure/modules/ingestion/build/ingestion_layer.zip

  # ---------- plan ----------

  plan_dev:
    runs-on: ubuntu-latest
    needs: [ci, unit_tests, build_orchestrator_layer, build_ingestion_layer]
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - uses: actions/download-artifact@v4
        with:
          name: orchestrator-layer
          path: infrastructure/modules/retrieval/build
      - uses: actions/download-artifact@v4
        with:
          name: ingestion-layer
          path: infrastructure/modules/ingestion/build
      - run: terraform init
        working-directory: infrastructure/environments/dev
      - run: terraform plan -out=tfplan
        working-directory: infrastructure/environments/dev
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/environments/dev/tfplan
      # Les data "archive_file" (code source des 3 Lambdas) sont zippees comme effet de
      # bord de `terraform plan`, sur le disque de CE job - deploy_dev tourne sur une VM
      # neuve et ne les a pas. Sans ca, "terraform apply tfplan" echoue en cherchant des
      # fichiers zip qui n'existent que sur le runner de plan_dev.
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-src-zips-dev
          path: |
            infrastructure/modules/ingestion/build/ingestion_code.zip
            infrastructure/modules/retrieval/build/index_bootstrap.zip
            infrastructure/modules/retrieval/build/orchestrator.zip

  plan_staging:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    needs: [ci, unit_tests, build_orchestrator_layer, build_ingestion_layer]
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - uses: actions/download-artifact@v4
        with:
          name: orchestrator-layer
          path: infrastructure/modules/retrieval/build
      - uses: actions/download-artifact@v4
        with:
          name: ingestion-layer
          path: infrastructure/modules/ingestion/build
      - run: terraform init
        working-directory: infrastructure/environments/staging
      - run: terraform plan -out=tfplan
        working-directory: infrastructure/environments/staging
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: infrastructure/environments/staging/tfplan
      # Voir la note equivalente dans plan_dev : les zips de code source Lambda ne
      # persistent pas entre jobs sans etre explicitement remontes en artefact.
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-src-zips-staging
          path: |
            infrastructure/modules/ingestion/build/ingestion_code.zip
            infrastructure/modules/retrieval/build/index_bootstrap.zip
            infrastructure/modules/retrieval/build/orchestrator.zip

  plan_prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [ci, unit_tests, build_orchestrator_layer, build_ingestion_layer]
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - uses: actions/download-artifact@v4
        with:
          name: orchestrator-layer
          path: infrastructure/modules/retrieval/build
      - uses: actions/download-artifact@v4
        with:
          name: ingestion-layer
          path: infrastructure/modules/ingestion/build
      - run: terraform init
        working-directory: infrastructure/environments/prod
      - run: terraform plan -out=tfplan
        working-directory: infrastructure/environments/prod
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: infrastructure/environments/prod/tfplan
      # Voir la note equivalente dans plan_dev : les zips de code source Lambda ne
      # persistent pas entre jobs sans etre explicitement remontes en artefact.
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-src-zips-prod
          path: |
            infrastructure/modules/ingestion/build/ingestion_code.zip
            infrastructure/modules/retrieval/build/index_bootstrap.zip
            infrastructure/modules/retrieval/build/orchestrator.zip

  # ---------- deploy_dev ----------
  # needs: [plan_dev] suffit - plan_dev dépend déjà de `ci`, qui inclut security_scan
  # (pip-audit), donc c'est déjà garanti passé à ce stade.

  deploy_dev:
    runs-on: ubuntu-latest
    needs: [plan_dev]
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/environments/dev
      - uses: actions/download-artifact@v4
        with:
          name: orchestrator-layer
          path: infrastructure/modules/retrieval/build
      - uses: actions/download-artifact@v4
        with:
          name: ingestion-layer
          path: infrastructure/modules/ingestion/build
      # Restaure les zips de code source generes par plan_dev (voir la note dans plan_dev) -
      # path "." pour preserver la meme arborescence relative qu'a l'upload.
      - uses: actions/download-artifact@v4
        with:
          name: lambda-src-zips-dev
          path: .
      - run: terraform init
        working-directory: infrastructure/environments/dev
      - run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/environments/dev

  # ---------- tests d'intégration, voir integration-tests.yml ----------

  integration_test:
    needs: [deploy_dev]
    uses: ./.github/workflows/integration-tests.yml

  evaluate_rag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [deploy_dev]
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - run: |
          cd src/evaluation
          python run_evaluation.py --output scores.json
          python check_thresholds.py --input scores.json --min-faithfulness 0.85 --min-recall 0.80
      - uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation
          path: |
            src/evaluation/scores.json
            src/evaluation/report.html
      - uses: mikepenz/action-junit-report@v4
        with:
          report_paths: src/evaluation/junit_report.xml

  # ---------- deploy_staging ----------
  # Se déclenche sur merge vers main, ET sur push direct d'une branche feat/*
  # (déploiement dev+staging en continu pendant le développement d'une feature).

  deploy_staging:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    needs: [plan_staging, integration_test]
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: infrastructure/environments/staging
      - uses: actions/download-artifact@v4
        with:
          name: orchestrator-layer
          path: infrastructure/modules/retrieval/build
      - uses: actions/download-artifact@v4
        with:
          name: ingestion-layer
          path: infrastructure/modules/ingestion/build
      - uses: actions/download-artifact@v4
        with:
          name: lambda-src-zips-staging
          path: .
      - run: terraform init
        working-directory: infrastructure/environments/staging
      - run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/environments/staging

  # ---------- deploy_prod ----------
  # L'approbation manuelle obligatoire se configure dans GitHub :
  # Settings > Environments > prod > Required reviewers.

  deploy_prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [plan_prod, deploy_staging]
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: infrastructure/environments/prod
      - uses: actions/download-artifact@v4
        with:
          name: orchestrator-layer
          path: infrastructure/modules/retrieval/build
      - uses: actions/download-artifact@v4
        with:
          name: ingestion-layer
          path: infrastructure/modules/ingestion/build
      - uses: actions/download-artifact@v4
        with:
          name: lambda-src-zips-prod
          path: .
      - run: terraform init
        working-directory: infrastructure/environments/prod
      - run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/environments/prod
